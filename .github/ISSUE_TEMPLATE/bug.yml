name: Bug report
description: Report a problem in this community reconstruction.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Please redact credentials and personal data. For sensitive security details, read SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Commit or app version
      placeholder: Commit SHA, development/baseline mode and build source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Device or simulator, iOS and Xcode version if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Do not attach signing keys, profiles, pairing records, private IPAs or tokens.
