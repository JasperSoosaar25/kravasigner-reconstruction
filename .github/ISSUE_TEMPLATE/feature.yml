name: Feature idea
description: Suggest an improvement or an idea for a fork.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Include how a user would use it and what a good result looks like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
  - type: checkboxes
    id: participation
    attributes:
      label: Would you like to help?
      options:
        - label: I can try implementing this.
        - label: I can help test or give feedback.
