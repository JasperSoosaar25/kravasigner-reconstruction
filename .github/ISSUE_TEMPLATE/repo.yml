name: Repository compatibility
description: Report an app-source format or repository compatibility issue.
body:
  - type: input
    id: source
    attributes:
      label: Public repository URL or invented example
      description: Do not include private access tokens or paid/private repository credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior and current result
    validations:
      required: true
